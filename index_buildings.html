{% extends 'base.html' %}

{% block title %}Building Dashboard{% endblock %}

{% block content %}
    <h1 class="heading">Building Inventory</h1>
        <div style="text-align: right; position: relative; text-align: right;">
        <a href="{{ url_for('add_buildings') }}" class="button1">Add</a>
        </div>


    <form method="get" action="{{url_for('index_buildings')}}" class="filter-form">
        <div class="form-group">
            <input type="text" name="search" placeholder="Search…" value="{{ search_query or ''}}" class="search">
        </div>
    </form>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Address</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for building in buildings %}
            <tr>
                <td>{{ building['name'] }}</td>
                <td>{{ building['address'] or '' }}</td>
                <td>

                        <form method="post" action="{{ url_for('delete_buildings', building_id = building['id']) }}" onsubmit="return confirm('Are you sure you want to delete {{building['name']}}?')" class="button4">
                        <button type="submit" class="button4">Delete</button>
                        </form>
                        <a href="{{ url_for('room_index', building_id = building['id'])}}" class="button5">Rooms</a>
               </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
