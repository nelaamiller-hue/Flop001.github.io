{% extends 'base.html' %}

{% block title %}Borrow Edit{% endblock %}

{% block content %}
    <h1 class="heading">Borrow {{ book['title'] }} by {{ book['author'] }}</h1>

{% if not borrows or not borrows['borrow'] %}
    <form method="post" action="{{ url_for('edit_borrow', book_id=book['id']) }}">

        <select name="customer_id" required class="filter2">
            <option value="" selected disabled>Select</option>
            {% for c in customers %}
                <option value="{{ c['id'] }}">{{ c['name'] }}</option>
            {% endfor %}
        </select>
        <button type="submit">Borrow</button>
    </form>
{% endif %}
{% endblock %}
