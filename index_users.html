{% extends 'base.html' %}

{% block title %}Users Dashboard{% endblock %}

{% block content %}
    <h1 class="heading">User Inventory</h1>
        <div style="text-align: right; position: relative; text-align: right;">
        <a href="{{ url_for('add_users') }}" class="button1">Add</a>
        </div>


    <form method="get" action="{{url_for('index_users')}}" class="filter-form">
        <div class="form-group">
            <input type="text" name="search" placeholder="Search…" value="{{ search_query or ''}}" class="search">
        </div>
    </form>

    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user['username']}}</td>
                <td>

                        <form method="post"
                              class="{% if user['id'] == current_user['id'] %}button45{% else %}button4{% endif %}"
                              action="{{ url_for('delete_users', user_id=user['id']) }}"
                              onsubmit="return confirm('Are you sure you want to delete {{ user['username'] }}?')">

                            <button type="submit"
                                    class="{% if user['id'] == current_user['id'] %}button45{% else %}button4{% endif %}"
                                    {% if user['id'] == current_user['id'] %}disabled{% endif %}>
                                Delete
                            </button>
                        </form>


               </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
