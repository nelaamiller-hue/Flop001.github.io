
{% extends 'base.html' %}

{% block title %}Add Copy{% endblock %}

{% block content %}
    <h1>Add Copy for: <em>{{ title['title'] }}</em></h1>
    <p>by {{ title['author'] }}</p>

    <form method="POST" class="add-book-form">
        <div class="form-group">
            <label for="building-select">Building</label>
            <select name="building" id="building-select" required>
                <option value="" disabled selected>Select a building</option>
                {% for building in buildings %}
                    <option value="{{ building['id'] }}">{{ building['name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="room-select">Room</label>
            <select name="room" id="room-select" required disabled>
                <option value="">Select a building first</option>
            </select>
        </div>
        <div class="form-group">
            <label for="shelf-select">Shelf</label>
            <select name="shelf" id="shelf-select" required disabled>
                <option value="">Select a room first</option>
            </select>
        </div>
        <button type="submit">Add This Copy</button>
    </form>
{% endblock %}
