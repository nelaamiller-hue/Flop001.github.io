{% extends 'base.html' %}

{% block title %}Customer Dashboard{% endblock %}

{% block content %}
    <h1 class="heading">Customer Inventory</h1>
        <div style="text-align: right; position: relative; text-align: right;">
        <a href="{{ url_for('add_customers') }}" class="button1">Add</a>
        </div>


    <form method="get" action="{{url_for('index_customers')}}" class="filter-form">
        <div class="form-group">
            <input type="text" name="search" placeholder="Search…" value="{{ search_query or ''}}" class="search">
        </div>
    </form>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for customer in customers %}
            <tr>
                <td>{{ customer['name']}}</td>
                <td>{{ customer['email']}}</td>
                <td>

                        <form method="post" class ="button4" action="{{ url_for('delete_customers', customer_id = customer['id']) }}" onsubmit="return confirm('Are you sure you want to delete {{customer['name']}}?')">
                        <button type="submit" class="button4">Delete</button>
                        </form>


               </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
