{% extends 'base.html' %}

{% block title %}Add a Building{% endblock %}

{% block content %}
    <h1 class="heading">Add a Building</h1>
    <form method="post">
        <label for="name">Name</label>
        <input name="name" id="name" required class="text_add">

        <label for="address">Address</label>
        <input name="address" id="address" class="text_add">


        <button type="submit">Add</button>
    </form>
{% endblock %}
